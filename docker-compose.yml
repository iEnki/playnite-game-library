# Playnite Game Library – Docker Compose / Portainer stack
# Settings come from a .env file (docker compose) or the "Environment variables"
# section of the Portainer stack. See .env.example.

services:
  web:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8095}:80"
    volumes:
      - html:/usr/share/nginx/html:ro
      - conf:/etc/nginx/conf.d:ro
    # the updater writes the nginx config on first start – wait for it
    command: ["sh", "-c", "while [ ! -f /etc/nginx/conf.d/default.conf ]; do sleep 1; done; exec nginx -g 'daemon off;'"]
    depends_on:
      - updater

  updater:          # service name must stay "updater" (nginx proxies /api/ to it)
    build: ./app
    image: playnite-game-library-updater:latest
    restart: unless-stopped
    environment:
      UPDATE_TOKEN: ${UPDATE_TOKEN:?set UPDATE_TOKEN (long random string)}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SESSION_DAYS: ${SESSION_DAYS:-30}
      SITE_TITLE: ${SITE_TITLE:-My Game Library}
      SITE_ICON: ${SITE_ICON:-🎮}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma4:12b-it-qat}
      TZ: ${TZ:-Europe/Vienna}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # lets the container reach Ollama on the Docker host
    volumes:
      - html:/site       # published web root (shared with nginx)
      - conf:/conf       # generated nginx config
      - data:/data       # persistent data: Steam cache, AI texts, AI settings, cover mapping

volumes:
  html:
  conf:
  data:
